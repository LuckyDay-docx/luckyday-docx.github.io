name: GitHub Pages — заглушка

# Сайт работает на Beget (kuhni-v-orenburge.ru). Выключить Pages у репозитория
# <владелец>.github.io GitHub не даёт, поэтому сюда публикуется не копия сайта,
# а заглушка: закрыта от индексации и переадресует посетителей на основной домен.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Собрать заглушку
        run: |
          mkdir stub
          printf 'User-agent: *\nDisallow: /\n' > stub/robots.txt
          cat > stub/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex, nofollow">
            <title>Кухни Оренбург</title>
            <link rel="canonical" href="https://kuhni-v-orenburge.ru/">
            <script>location.replace('https://kuhni-v-orenburge.ru' + location.pathname + location.search + location.hash);</script>
            <meta http-equiv="refresh" content="0; url=https://kuhni-v-orenburge.ru/">
          </head>
          <body>
            <p>Сайт переехал: <a href="https://kuhni-v-orenburge.ru/">kuhni-v-orenburge.ru</a></p>
          </body>
          </html>
          HTML
          # Любой старый адрес (например, /catalog/) тоже ведёт на домен
          cp stub/index.html stub/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stub

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
